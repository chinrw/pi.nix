name: Cron

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: cron
  cancel-in-progress: false

jobs:
  cron:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Install Nix
        uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Set up Cachix
        uses: cachix/cachix-action@18cf96c7c98e048e10a83abd92116114cd8504be # v14
        with:
          name: pi
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Update version and models
        id: update
        run: ./update.sh

      - name: Run security scans
        run: nix run .#scan --accept-flake-config

      - name: Commit and push changes
        env:
          BRANCH: ${{ github.ref_name }}
          VERSION: ${{ steps.update.outputs.version }}
          VERSION_CHANGED: ${{ steps.update.outputs.version_changed }}
          MODELS_CHANGED: ${{ steps.update.outputs.models_changed }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet --exit-code VERSION.json models.generated.ts package-lock.json bun.lock coding-agent/bun.nix; then
            echo "No changes to commit"
            exit 0
          fi

          version="$VERSION"

          push_tag=false
          if [[ "$VERSION_CHANGED" == "true" ]]; then
            git add VERSION.json models.generated.ts package-lock.json bun.lock coding-agent/bun.nix
            git commit -m "Update pi to ${version}"

            if ! git ls-remote --tags --refs origin "refs/tags/${version}" | grep -q .; then
              git tag -a "${version}" -m "${version}"
              push_tag=true
            fi
          else
            git add models.generated.ts package-lock.json bun.lock coding-agent/bun.nix
            if [[ "$MODELS_CHANGED" == "true" ]]; then
              git commit -m "Update models"
            else
              git commit -m "Update lockfiles"
            fi
          fi

          git push origin "HEAD:${BRANCH}"
          if [[ "$push_tag" == "true" ]]; then
            git push origin "refs/tags/${version}"
          fi
